apiVersion: v1
kind: Service
metadata:
  name: router
  namespace: {{ include "mine-kube.namespace" . }}
  labels:
    {{- include "mine-kube.labels" . | nindent 4 }}
    app.kubernetes.io/name: router
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: router
  ports:
    - port: 25565
      targetPort: 25565
      protocol: TCP
      name: minecraft

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mc-router
  namespace: {{ include "mine-kube.namespace" . }}
  labels:
    {{- include "mine-kube.labels" . | nindent 4 }}
    app.kubernetes.io/name: router
spec:
  serviceName: mc-router
  replicas: 1
  selector:
    matchLabels:
      {{- include "mine-kube.labels" . | nindent 6 }}
      app.kubernetes.io/name: router
  template:
    metadata:
      labels:
        {{- include "mine-kube.labels" . | nindent 8 }}
        app.kubernetes.io/name: router
    spec:
      serviceAccountName: router
      containers:
        - name: router
          image: itzg/mc-router
          ports:
            - containerPort: 25565
          args:
            - -in-kube-cluster
            - {{ printf "-kube-namespace=%s" (include "mine-kube.namespace" .) }}
            - -record-logins

---

{{- range $key, $val := .Values.minecraft.servers }}
{{- $val := merge (dict "name" $key) $val $.Values.minecraft.shared }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $key }}
  namespace: {{ include "mine-kube.namespace" $ }}
  labels:
    {{- include "mine-kube.labels" $ | nindent 4 }}
    {{- include "mine-kube.server.labels" $val | nindent 4 }}
  annotations:
    "mc-router.itzg.me/externalServerName": {{ $val.hostname | default (printf "%s.%s" $key $.Values.minecraft.shared.domain) | lower | quote }}
spec:
  selector:
    {{- include "mine-kube.server.labels" $val | nindent 4 }}
  ports:
    - port: 25565
      targetPort: 25565
      protocol: TCP
      name: minecraft
{{ end -}}

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mine-kube-services-watcher
  namespace: {{ include "mine-kube.namespace" . }}
  labels:
    {{- include "mine-kube.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["services"]
  verbs: ["watch","list"]
- apiGroups: ["apps"]
  resources: ["statefulsets"]
  verbs: ["watch","list","patch"]
- apiGroups: ["apps"]
  resources: ["statefulsets/scale"]
  verbs: ["get"]

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: router
  namespace: {{ include "mine-kube.namespace" . }}
  labels:
    {{- include "mine-kube.labels" . | nindent 4 }}

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mine-kube-router-watches-services
  namespace: {{ include "mine-kube.namespace" . }}
  labels:
    {{- include "mine-kube.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: router
    namespace: {{ include "mine-kube.namespace" . }}
roleRef:
  kind: ClusterRole
  name: mine-kube-services-watcher