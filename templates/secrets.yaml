{{/* Lookup existing secret and use that value instead of the default */}}
{{- $cfSecret := lookup "v1" "Secret" (include "mine-kube.namespace" $) "cf-api-key-secret" | default (dict "data" dict ) -}}

apiVersion: v1
kind: Secret
metadata:
  name: cf-api-key-secret
  namespace: {{ include "mine-kube.namespace" . | quote }}
  labels:
    {{- include "mine-kube.labels" . | nindent 4 }}
  {{- with .Values.minecraft.shared.cf_api_key_secret_annotations }}
  annotations:
    {{- toYaml . | nindent 8 }}
  {{- end }}
data:
  CF_API_KEY: {{ $cfSecret.data.CF_API_KEY }}
---

{{- range $key, $val := .Values.minecraft.servers }}

{{/* Lookup existing secret and use that value instead of the default */}}
{{- $serverSecret := lookup "v1" "Secret" (include "mine-kube.namespace" $) (printf "%s-secrets" $key) | default (dict "data" dict ) -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secrets" $key }}
  namespace: {{ include "mine-kube.namespace" $ | quote }}
  labels:
    {{- include "mine-kube.labels" $ | nindent 4 }}
  {{- with $val.secret_annotations }}
  annotations:
    {{- toYaml . | nindent 8 }}
  {{- end }}
data:
  RCON_PASSWORD: {{ $serverSecret.data.RCON_PASSWORD | default (randAlphaNum 16 | b64enc) }}
  # Will overwrite global api key if filled
  CF_API_KEY: {{ $serverSecret.data.CF_API_KEY }}

{{ end -}}
---

{{/* Lookup existing secret and use that value instead of the default */}}
{{- $resticSecret := lookup "v1" "Secret" (include "mine-kube.namespace" $) "restic-secret" | default (dict "data" dict ) -}}

apiVersion: v1
kind: Secret
metadata:
  name: restic-secret
  namespace: {{ include "mine-kube.namespace" . | quote }}
  labels:
    {{- include "mine-kube.labels" . | nindent 4 }}
  {{- with .Values.backups.restic.restic_secret_annotations }}
  annotations:
    {{- toYaml . | nindent 8 }}
  {{- end }}
data:
  restic_password: {{ $resticSecret.data.restic_password }}
  rclone_conf: {{ $resticSecret.data.rclone_conf }}
