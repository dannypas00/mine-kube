{{- range $key, $val := .Values.minecraft.servers }}
{{- $val := merge (dict "name" $key) $val $.Values.minecraft.shared }}
{{- $backup := .backup | default dict -}}
{{- $tar_enabled := and $backup.tar_enabled (ne (index $.Values "backups" "tar" "enabled") false) -}}
{{- $restic_enabled := and $backup.restic_enabled (ne (index $.Values "backups" "restic" "enabled") false) -}}

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ printf "%s-%s" (include "mine-kube.name" $) $key }}
  namespace: {{ include "mine-kube.namespace" $ }}
  labels:
    {{- include "mine-kube.labels" $ | nindent 4 }}
    {{- include "mine-kube.server.labels" $val | nindent 4 }}
spec:
  replicas: {{ ternary 1 0 (hasKey . "enabled" | ternary .enabled true) }}
  selector:
    matchLabels:
      {{- include "mine-kube.labels" $ | nindent 6 }}
      {{- include "mine-kube.server.labels" $val | nindent 6 }}
  template:
    metadata:
      {{- with $.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mine-kube.labels" $ | nindent 8 }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "mine-kube.server.labels" $val | nindent 8 }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mine-kube.serviceAccountName" $ }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: "minecraft"
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "mine-kube.server.image" $val }}
          imagePullPolicy: {{ .image.pullPolicy | default "IfNotPresent" }}
          ports:
          - name: minecraft
            containerPort: 25565
            protocol: TCP
          startupProbe:
            exec:
              command:
              - mc-health
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 100
          envFrom:
          {{- if eq (include "mine-kube.server.type" .) "AUTO_CURSEFORGE" }}
          - secretRef:
              name: {{ $.Values.minecraft.shared.cf_api_key_secret | default "cf-api-key-secret" | quote }}
          {{- end }}
          - secretRef:
              name: {{ .existing_secret | default (printf "%s-secrets" $key) | quote }}
          - configMapRef:
              name: {{ printf "%s-shared" (include "mine-kube.name" $) | quote }}
          - configMapRef:
              name: {{ printf "%s-%s" (include "mine-kube.name" $) $key | quote }}
          volumeMounts:
          - mountPath: /data
            name: data

        {{- if $.Values.backups -}}

        {{/*
        Tar backup
        */}}
        {{ if $tar_enabled -}}
        - name: "tar-backup"
          image: {{ include "mine-kube.backup.image" $.Values.backups }}
          env:
          - name: RCON_HOST
            value: "127.0.0.1"
          - name: RCON_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ printf "%s-secrets" $key | quote }}
                key: "RCON_PASSWORD"
          - name: BACKUP_INTERVAL
            value: {{ $backup.tar_interval | quote }}
          - name: PAUSE_IF_NO_PLAYERS
            value: {{ $backup.pause_if_no_players | quote }}
          - name: BACKUP_METHOD
            value: "tar"
          - name: SRC_DIR
            value: "/data"
          - name: DEST_DIR
            value: "/backups/{{ $key }}"
          - name: INCLUDES
            value: {{ $backup.include_dirs | join "," | default "world" | quote }}
          volumeMounts:
          - mountPath: "/backups"
            name: backup
          - mountPath: /data
            name: data
        {{- end -}}

        {{/*
        Restic backup
        */}}
        {{ if $restic_enabled -}}
        - name: "restic-backup"
          image: {{ include "mine-kube.backup.image" $.Values.backups }}
          # Copy rclone config to its correct location
          env:
          - name: RCON_HOST
            value: "127.0.0.1"
          - name: RCON_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ printf "%s-secrets" $key | quote }}
                key: "RCON_PASSWORD"
          - name: BACKUP_INTERVAL
            value: {{ $backup.restic_interval | quote }}
          - name: PAUSE_IF_NO_PLAYERS
            value: {{ $backup.pause_if_no_players | quote }}
          - name: BACKUP_METHOD
            value: "restic"
          - name: RESTIC_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ index $.Values.backups "restic" "restic_secret" | default "restic-secret" | quote }}
                key: "restic_password"
          - name: RESTIC_REPOSITORY
            value: {{ printf "%s/%s" (index $.Values.backups "restic" "repository_base") $key | quote }}
          - name: SRC_DIR
            value: "/data"
          - name: INCLUDES
            value: {{ $backup.include_dirs | join "," | default "world" | quote }}
          volumeMounts:
          - mountPath: /tmp/.config/rclone
            name: rclone-config
          - mountPath: /data
            name: data
        {{- end -}}
        {{- end -}}

      {{- with .nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ index $.Values "data_volume" "override_persistent_volume" | default (printf "data-%s" $key) }}
      {{- if $tar_enabled }}
      - name: backup
        persistentVolumeClaim:
          claimName: {{ index $.Values "backups" "tar" "override_persistent_volume" | default (printf "backup-%s" $key) }}
      {{ end -}}
      - name: rclone-config
        secret:
          secretName: restic-secret
          optional: true

---

{{/*
Data PVC
*/}}

{{- if empty (index $.Values "data_volume" "override_persistent_volume") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "data-%s" $key }}
  namespace: {{ include "mine-kube.namespace" $ }}
  labels:
    {{- include "mine-kube.labels" $ | nindent 4 }}
    {{- include "mine-kube.server.labels" $val | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .data_volume_size_override | default $.Values.data_volume.size | default "25Gi" }}

---
{{ end -}}

{{/*
Tar backup PVC
*/}}

{{- if and (empty (index $.Values "backups" "tar" "override_persistent_volume")) $tar_enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "backup-%s" $key }}
  namespace: {{ include "mine-kube.namespace" $ }}
  labels:
    {{- include "mine-kube.labels" $ | nindent 4 }}
    {{- include "mine-kube.server.labels" $val | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .tar_volume_size_override | default $.Values.backups.tar.size | default "200Gi" }}

---
{{ end -}}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-%s" (include "mine-kube.name" $) $key }}
  namespace: {{ include "mine-kube.namespace" $ | quote }}
  labels:
    {{- include "mine-kube.labels" $ | nindent 4 }}
    {{- include "mine-kube.server.labels" . | nindent 4 }}
data:
{{ range (include "mine-kube.server.env" . | splitList "\n") }}
{{/* Filter out all empty values */}}
{{- if (regexMatch "^.+: \".+\"$" (trim .)) -}}
  {{ trim . | indent 2 | replace "true" "TRUE" | replace "false" "FALSE" }}
{{ end -}}
{{ end -}}

---

{{- end -}}

{{/*
Shared env variables
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-shared" (include "mine-kube.name" $) }}
  namespace: {{ include "mine-kube.namespace" $ | quote }}
  labels:
    {{- include "mine-kube.labels" . | nindent 4 }}
data:
{{ range (include "mine-kube.server.env" .Values.minecraft.shared | splitList "\n") }}
{{/* Filter out all empty values */}}
{{- if (regexMatch "^.+: \".+\"$" (trim .)) -}}
  {{ trim . | indent 2 | replace "true" "TRUE" | replace "false" "FALSE" }}
{{ end -}}
{{ end -}}