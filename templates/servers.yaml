{{- range $key, $val := .Values.minecraft.servers -}}
{{- $val := merge (dict "name" $key) $val -}}

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ printf "%s-%s" (include "mine-kube.name" $) $key }}
  namespace: {{ include "mine-kube.namespace" $ }}
  labels:
    {{- include "mine-kube.labels" $ | nindent 4 }}
    {{- include "mine-kube.server.labels" $val | nindent 4 }}
spec:
  replicas: {{ ternary 1 0 (hasKey . "enabled" | ternary .enabled true) }}
  selector:
    matchLabels:
      {{- include "mine-kube.labels" $ | nindent 6 }}
      {{- include "mine-kube.server.labels" $val | nindent 6 }}
  template:
    metadata:
      {{- with $.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mine-kube.labels" $ | nindent 8 }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "mine-kube.server.labels" $val | nindent 8 }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mine-kube.serviceAccountName" $ }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: "minecraft"
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "mine-kube.server.image" . }}
          imagePullPolicy: {{ .image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
          
      {{- with .nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{ end -}}