# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
securityContext: {}

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

minecraft:
  shared:
    # Set this to true if you've read and agree to the minecraft EULA: https://www.minecraft.net/en-us/eula
    eula: false
    whitelist: []
      # - dannypas00
    ops: []
      # - dannypas00
    # Domain used to automatically assign wildcard subdomains, e.g. server "vanilla" will host on "vanilla.example.com"
    # Exact hostname can be changed per server through the `hostname` value
    domain: example.com
    # Use an existing secret for the curseforge API key. If not set, a new empty secret will be created and needs to manually be filled
    # cf_api_key_secret: "mine-kube.cf-api-key-secret"

    # TODO: Downloads volume for mods that curseforge does not allow automatic downloading for
  servers:
    vanilla:
      # Enable and disable server instead of removing it entirely (and potentially deleting volumes, DNS entries etc.)
      enabled: true
      # TODO: Should change to volume mount since most clusters won't have one big directory for all servers
      directory: vanilla
      # Server type, defaults to VANILLA. See: https://docker-minecraft-server.readthedocs.io/en/latest/types-and-platforms/
      type: VANILLA
      # Minecraft version. Can be "latest" or any version e.g. "1.20.1" or "26.3"
      version: "latest"
      enable_whitelist: true
      min_memory: 1G
      max_memory: 1G
      backup:
        # Which directories to include in backups. Recommended to only include world data in here
        include_dirs: "world"
        pause_if_no_players: true
        tar_interval: "1h"
        restic_interval: "24h"
      # These values overwrite the shared or generated values above
      # hostname: vanilla.example.com
      # eula: false
      # whitelist: []
      # ops: []

      # TODO
      # Set the server icon
      icon: ""
      # TODO: OVERRIDE_ICON auto-toggle when `icon` value changes
      # Explicitly not allowing server port changes since this should be done with services instead
      schedule:
        stop_server_announce_delay: ""
        stop_server_delay_command: ""
        stop_duration: 60
        pre_start_script: ""
        # RCON schedule commands
        startup_cmd: ""
        on_connect_cmd: ""
        first_connect_cmd: ""
        on_disconnect_cmd: ""
        last_disconnect_cmd: ""
      use_flare_flags: ""
      use_simd_flags: false
      proxy: false
      console: true
      guid: true
      # Only create the server files, exit after creation is successful
      setup_only: false

      # Use existing secret for RCON password instead of generating one. Only intended for externally managed secrets.
      # It is strongly recommended to not re-use the same RCON password for multiple servers
      # rcon_secret: "mine-kube.vanilla-rcon-password"

      # See: https://docker-minecraft-server.readthedocs.io/en/latest/variables/#auto-pause
      # auto_pause:
      #   timeout_est: 3600
      #   timeout_init: 600
      #   timeout_kn: 120
      #   period: 10
      #   knock_interface: eth0
      #   debug: false
      # See: https://docker-minecraft-server.readthedocs.io/en/latest/variables/#auto-stop
      # auto_stop:
      #   timeout_est: 3600
      #   timeout_init: 1800
      #   period: 10
      #   debug: false

      # See: https://docker-minecraft-server.readthedocs.io/en/latest/variables/#curseforge
      curseforge: {}
        # Overwrite shared API key secret
        # api_key_secret: "mine-kube.cf_api_key_secret"

        # Strongly recommended to pin exact modpack versions to prevent auto-updates on restart
        # Find the file url by navigating to the "server files" file on the CurseForge website
        # page_url: "https://www.curseforge.com/minecraft/modpacks/all-the-mods-10/files/9431427"

        # Do not change these values unless you know what you're doing
        # exclude_include_file: ""
        # exclude_mods: []
        # force_include_mods: []
        # ignore_missing_files: []
        # force_synchronize: false
        # set_level_from: ""
        # parallel_downloads: 4
        # override_skips_existing: false
        # mod_loader_version: ""
      
      resources:
        requests:
          cpu: 500m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1000Mi
        java:
          # Recommended to keep these slightly under resource limits
          # `memory` sets both init and max memory to the same value
          memory: 950M
          # init_memory: 200M
          # max_memory: 950M

      # Set extra env values for the itzg/docker-minecraft container. Useful for changing server.properties values not defined as chart values
      # See: https://docker-minecraft-server.readthedocs.io/en/latest/variables/#server-properties
      extra_env: {}
        # SEED: "12345"

data_volume: {}
  # Each server will create a persistentVolumeClaim for its data
  # These claims will use a newly created emptyDir persistentVolume but this can be changed below
  # TODO: Create tutorial docs on using a local PV
  # data:
  #   overwrite_persistent_volume: "local-data-pv"

backups:
  # Tar backups will periodically zip up the world (or other specified directories) and move them to a volume
  tar:
    # If enabled, each server will create its own persistentVolumeClaim where its tars backups will be stored
    # It is *heavily* recommended to change this to be an external storage such as a NAS or a cloud storage bucket
    enabled: true
    # overwrite_persistent_volume: "nfs-backup-pv"

  # Restic backups automatically create backups in places such as Google Drive, Dropbox, S3 and many more. For all options, see: https://rclone.org/overview/
  # Restic backups are intended for personal use. Backing up to cloud storages at scale is better handled through S3, GCP, or other external volume integrations for k8s
  # Backups will be stored in the same parent directory and all servers can overwrite other servers' backups. If this is a threat to you, please do not use restic backups
  restic:
    enabled: false
    # This name is generated when you create the rclone config. See: https://github.com/itzg/docker-mc-backup?tab=readme-ov-file#restic
    repository_base: "rclone:gdrive:/Backups/Minecraft"
    # Existing secret for the secret restic values. By default an empty secret will be created that you need to fill manually
    # TODO: Add rclone.conf and password to this secret
    # restic_secret: "mine-kube.restic-secret"
